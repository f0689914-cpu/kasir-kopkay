        { id: 'T12', name: 'VIP Room B', zone: 'VIP', capacity: 6, status: 'reserved', guestName: 'Meeting Keluarga' },
      ];

      const formatRp = (val) => 'Rp ' + Number(val || 0).toLocaleString('id-ID');

      const loadStorage = (key, fallback) => {
        try {
          const raw = localStorage.getItem(key);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed !== null && parsed !== undefined) return parsed;
          }
        } catch (e) {}
        return fallback;
      };

      function App() {
        const [darkMode, setDarkMode] = useState(() => loadStorage('kopkay_dark_v1', false));
        const [role, setRole] = useState(() => loadStorage('kopkay_role_v1', 'Cashier'));
        const [activeTab, setActiveTab] = useState('order');

        const [menuItems, setMenuItems] = useState(() => loadStorage('kopkay_menu_v1', INITIAL_MENU_ITEMS));
        const [tables, setTables] = useState(() => loadStorage('kopkay_tables_v1', INITIAL_TABLES));
        const [orders, setOrders] = useState(() => loadStorage('kopkay_orders_v1', []));

        // Filter & Cart states
        const [selectedTenant, setSelectedTenant] = useState('all');
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [cart, setCart] = useState([]);
        const [orderType, setOrderType] = useState('Dine-in');
        const [tableName, setTableName] = useState('Meja 01');
        const [customerName, setCustomerName] = useState('');
        const [orderNote, setOrderNote] = useState('');
        const [paymentMethod, setPaymentMethod] = useState('Tunai');
        const [cashReceived, setCashReceived] = useState('');
        const [errorMsg, setErrorMsg] = useState('');
        const [receiptOrder, setReceiptOrder] = useState(null);
        const [mobileCartOpen, setMobileCartOpen] = useState(false);

        // Table states
        const [zoneFilter, setZoneFilter] = useState('All');
        const [selectedTableId, setSelectedTableId] = useState('T01');
        const [newTableName, setNewTableName] = useState('');
        const [newTableZone, setNewTableZone] = useState('Indoor');
        const [newTableCap, setNewTableCap] = useState(4);

        // Kitchen clock
        const [now, setNow] = useState(Date.now());

        // Admin new menu form
        const [newMenuName, setNewMenuName] = useState('');
        const [newMenuPrice, setNewMenuPrice] = useState('');
        const [newMenuTenant, setNewMenuTenant] = useState('kopkay');
        const [newMenuCat, setNewMenuCat] = useState('Makanan Utama');
        const fileInputRef = useRef(null);

        useEffect(() => {
          localStorage.setItem('kopkay_dark_v1', JSON.stringify(darkMode));
          if (darkMode) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }, [darkMode]);

        useEffect(() => {
          localStorage.setItem('kopkay_role_v1', JSON.stringify(role));
          if (role !== 'Admin' && activeTab === 'menu-admin') setActiveTab('order');
        }, [role, activeTab]);

        useEffect(() => {
          localStorage.setItem('kopkay_menu_v1', JSON.stringify(menuItems));
        }, [menuItems]);

        useEffect(() => {
          localStorage.setItem('kopkay_tables_v1', JSON.stringify(tables));
        }, [tables]);

        useEffect(() => {
          localStorage.setItem('kopkay_orders_v1', JSON.stringify(orders));
        }, [orders]);

        useEffect(() => {
          const timer = setInterval(() => setNow(Date.now()), 15000);
          return () => clearInterval(timer);
        }, []);

        const categories = useMemo(() => {
          const filtered = selectedTenant === 'all' ? menuItems : menuItems.filter((i) => i.tenantId === selectedTenant);
          return ['All', ...Array.from(new Set(filtered.map((i) => i.category)))];
        }, [menuItems, selectedTenant]);

        const visibleItems = useMemo(() => {
          return menuItems.filter((item) => {
            const matchTenant = selectedTenant === 'all' || item.tenantId === selectedTenant;
            const matchCategory = selectedCategory === 'All' || item.category === selectedCategory;
            const matchSearch =
              !searchQuery.trim() ||
              item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.category.toLowerCase().includes(searchQuery.toLowerCase());
            return matchTenant && matchCategory && matchSearch;
          });
        }, [menuItems, selectedTenant, selectedCategory, searchQuery]);

        const subtotal = cart.reduce((sum, c) => sum + c.price * c.qty, 0);
        const totalCartQty = cart.reduce((sum, c) => sum + c.qty, 0);
        const getQtyInCart = (id) => cart.find((c) => c.id === id)?.qty || 0;
        const getTenantName = (id) => TENANTS.find((t) => t.id === id)?.name || id;

        const addToCart = (item) => {
          if (!item.available) return;
          setCart((prev) => {
            const found = prev.find((c) => c.id === item.id);
            if (found) return prev.map((c) => (c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
            return [...prev, { id: item.id, name: item.name, price: item.price, tenantId: item.tenantId, category: item.category, qty: 1 }];
          });
        };

        const updateQty = (id, delta) => {
          setCart((prev) => prev.map((c) => (c.id === id ? { ...c, qty: c.qty + delta } : c)).filter((c) => c.qty > 0));
        };

        const handleCheckout = () => {
          setErrorMsg('');
          if (cart.length === 0) {
            setErrorMsg('Keranjang pesanan masih kosong.');
            return;
          }
          const numericCash = paymentMethod === 'Tunai' ? Number(cashReceived) || subtotal : subtotal;
          if (paymentMethod === 'Tunai' && numericCash < subtotal) {
            setErrorMsg('Uang tunai yang diterima kurang dari total tagihan.');
            return;
          }

          const tenantBreakdown = TENANTS.map((tenant) => {
            const tItems = cart.filter((i) => i.tenantId === tenant.id);
            const grossSales = tItems.reduce((sum, i) => sum + i.price * i.qty, 0);
            const commissionCut = Math.round(grossSales * tenant.commissionRate);
            return {
              tenantId: tenant.id,
              tenantName: tenant.name,
              ownerType: tenant.ownerType,
              commissionRate: tenant.commissionRate,
              grossSales,
              commissionCut,
              netTenantPayout: grossSales - commissionCut,
            };
          }).filter((t) => t.grossSales > 0);

          const newOrder = {
            id: 'ORD-' + String(Date.now()).slice(-6),
            createdAt: new Date().toISOString(),
            orderType,
            tableName: orderType === 'Dine-in' ? tableName : 'Takeaway',
            customerName: customerName.trim() || 'Pelanggan Umum',
            orderNote: orderNote.trim(),
            items: [...cart],
            total: subtotal,
            paymentMethod,
            cashReceived: numericCash,
            changeAmount: paymentMethod === 'Tunai' ? numericCash - subtotal : 0,
            kitchenStatus: 'New',
            tenantBreakdown,
          };

          setOrders((prev) => [newOrder, ...prev]);

          if (orderType === 'Dine-in') {
            setTables((prev) =>
              prev.map((t) => (t.name === tableName ? { ...t, status: 'occupied', guestName: newOrder.customerName } : t))
            );
          }

          setCart([]);
          setCustomerName('');
          setOrderNote('');
          setCashReceived('');
          setMobileCartOpen(false);
          setReceiptOrder(newOrder);
        };

        // Summary calculations
        const summaryByTenant = useMemo(() => {
          return TENANTS.map((tenant) => {
            let grossSales = 0;
            let totalQty = 0;
            orders.forEach((order) => {
              order.items.forEach((item) => {
                if (item.tenantId === tenant.id) {
                  grossSales += item.price * item.qty;
                  totalQty += item.qty;
                }
              });
            });
            const commissionCut = Math.round(grossSales * tenant.commissionRate);
            return {
              ...tenant,
              totalQty,
              grossSales,
              commissionCut,
              netPayout: grossSales - commissionCut,
            };
          });
        }, [orders]);

        const shiftTotals = summaryByTenant.reduce(
          (acc, cur) => ({
            qty: acc.qty + cur.totalQty,
            gross: acc.gross + cur.grossSales,
            commission: acc.commission + cur.commissionCut,
            net: acc.net + cur.netPayout,
          }),
          { qty: 0, gross: 0, commission: 0, net: 0 }
        );

        const kopkayIncome =
          (summaryByTenant.find((t) => t.id === 'kopkay')?.grossSales || 0) + shiftTotals.commission;

        const exportCSV = () => {
          const headers = ['Nama Tenant', 'Skema', 'Item Terjual', 'Omzet Kotor (Rp)', 'Potongan 10% (Rp)', 'Hak Bersih Tenant (Rp)'];
          const rows = summaryByTenant.map((t) => [
            `"${t.name}"`,
            t.ownerType === 'internal' ? 'Utama (0%)' : 'Mitra (10%)',
            t.totalQty,
            t.grossSales,
            t.commissionCut,
            t.netPayout,
          ]);
          rows.push(['"TOTAL"', '""', shiftTotals.qty, shiftTotals.gross, shiftTotals.commission, shiftTotals.net]);
          const csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map((r) => r.join(','))].join('
');
          const link = document.createElement('a');
          link.setAttribute('href', encodeURI(csv));
          link.setAttribute('download', `rekap-shift-kopkay-${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const exportJSON = () => {
          const blob = new Blob([JSON.stringify(orders, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `backup-kopkay-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const activeKitchenCount = orders.filter((o) => o.kitchenStatus !== 'Completed').length;

        const navItems = [
          { id: 'order', label: 'Kasir', icon: 'cart' },
          { id: 'tables', label: 'Meja', icon: 'grid' },
          { id: 'kitchen', label: 'Dapur', icon: 'chef', badge: activeKitchenCount || null },
          { id: 'dashboard', label: 'Ringkasan', icon: 'dashboard' },
          { id: 'report', label: 'Rekap 10%', icon: 'report' },
          ...(role === 'Admin' ? [{ id: 'menu-admin', label: 'Atur Menu', icon: 'sliders' }] : []),
        ];

        const statusStyles = {
          available: { label: 'Kosong', border: 'border-emerald-500/70 bg-emerald-50/40 dark:bg-emerald-950/20', badge: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300' },
          occupied: { label: 'Terisi', border: 'border-amber-500/70 bg-amber-50/40 dark:bg-amber-950/20', badge: 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300' },
          reserved: { label: 'Reservasi', border: 'border-sky-500/70 bg-sky-50/40 dark:bg-sky-950/20', badge: 'bg-sky-100 text-sky-800 dark:bg-sky-900/60 dark:text-sky-300' },
          cleaning: { label: 'Bersihkan', border: 'border-rose-500/70 bg-rose-50/40 dark:bg-rose-950/20', badge: 'bg-rose-100 text-rose-800 dark:bg-rose-900/60 dark:text-rose-300' },
        };

        const selectedTable = tables.find((t) => t.id === selectedTableId) || tables[0];

              <div className="flex items-center gap-3">

                )}
                <button
                  onClick={() => setMobileCartOpen(false)}

                    {type}

              </div>

                    {tables.map((t) => (
                      <option key={t.id} value={t.name}>

                    orderType === 'Takeaway' ? 'col-span-2' : ''

                />
              </div>
              <input

            <div className="flex-1 overflow-y-auto p-3.5 space-y-2">
              {cart.length === 0 ? (

                  <p className="mt-1">Pilih menu untuk menambah pesanan.</p>

              ) : (
                cart.map((item) => (
                  <div
                    key={item.id}
                    className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-800/40 flex items-center justify-between gap-2"
                  >
                    <div className="min-w-0">
                      <p className="text-xs font-bold text-slate-900 dark:text-white truncate">{item.name}</p>
                      <p className="text-[11px] text-slate-500">
                        {formatRp(item.price)} x {item.qty}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      <button
                        onClick={() => updateQty(item.id, -1)}
                        className="w-6 h-6 rounded-lg bg-slate-200 dark:bg-slate-700 flex items-center justify-center"
                      >
                        <Icon name="minus" className="w-3 h-3" />
                      </button>
                      <span className="text-xs font-bold w-4 text-center">{item.qty}</span>
                      <button
                        onClick={() => updateQty(item.id, 1)}
                        className="w-6 h-6 rounded-lg bg-teal-600 text-white flex items-center justify-center"
                      >
                        <Icon name="plus" className="w-3 h-3" />
                      </button>
                      <span className="text-xs font-bold w-20 text-right">{formatRp(item.price * item.qty)}</span>
                    </div>
                  </div>
                ))
              )}
            </div>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 space-y-3 bg-slate-50 dark:bg-slate-950/40">
              {errorMsg && (

                  <Icon name="alert" className="w-4 h-4 shrink-0" />
                  <span>{errorMsg}</span>
                </div>
              )}

              <div className="grid grid-cols-2 gap-2">
                {['Tunai', 'QRIS'].map((m) => (
                  <button
                    key={m}
                    onClick={() => setPaymentMethod(m)}
                    className={`py-2 rounded-xl text-xs font-semibold border ${
                      paymentMethod === m
                        ? 'bg-slate-900 text-white border-slate-900 dark:bg-teal-600 dark:border-teal-600'
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                    }`}
                  >
                    {m}
                  </button>
                ))}
              </div>

              {paymentMethod === 'Tunai' && cart.length > 0 && (
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between text-xs">
                    <span className="text-slate-500">Uang Diterima:</span>
                    <div className="flex gap-1">
                      {[subtotal, 50000, 100000].map((preset) => (
                        <button
                          key={preset}
                          onClick={() => setCashReceived(String(preset))}
                          className="px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-[11px] font-medium"
                        >
                          {preset === subtotal ? 'Pas' : formatRp(preset)}
                        </button>
                      ))}
                    </div>
                  </div>
                  <input
                    type="number"
                    value={cashReceived}
                    onChange={(e) => setCashReceived(e.target.value)}
                    placeholder={`Minimal ${subtotal}`}
                    className="w-full px-3 py-1.5 rounded-xl text-sm font-semibold border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800"
                  />
                  {Number(cashReceived) >= subtotal && (
                    <div className="flex justify-between text-xs font-semibold text-emerald-600 dark:text-emerald-400">
                      <span>Kembalian:</span>
                      <span>{formatRp(Number(cashReceived) - subtotal)}</span>
                    </div>
                  )}
                </div>
              )}

              <div className="flex items-center justify-between">
                <span className="text-sm font-semibold text-slate-600 dark:text-slate-300">Total Bayar</span>
                <span className="text-xl font-extrabold text-slate-900 dark:text-white">{formatRp(subtotal)}</span>
              </div>

              <button
                onClick={handleCheckout}
                disabled={cart.length === 0}
                className="w-full py-3 rounded-xl bg-teal-600 hover:bg-teal-700 disabled:opacity-40 text-white font-bold text-sm shadow-sm"
              >
                Proses Pembayaran & Struk
              </button>
            </div>
          </div>
        );

        return (
          <div className="h-screen w-screen overflow-hidden flex flex-col lg:flex-row bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
            {/* Desktop Sidebar */}
            <aside className="hidden lg:flex w-64 shrink-0 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex-col justify-between">
              <div>
                <div className="h-16 px-4 flex items-center gap-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="w-10 h-10 rounded-xl bg-teal-600 text-white flex items-center justify-center shrink-0">
                    <Icon name="coffee" className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="font-bold text-sm text-slate-900 dark:text-white">KASIR KOPKAY</h1>
                    <p className="text-[11px] font-medium text-teal-600 dark:text-teal-400">KOPITIAM KOPI & KAYA</p>
                  </div>
                </div>
                <nav className="p-3 space-y-1.5">
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium ${
                        activeTab === item.id
                          ? 'bg-teal-600 text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/70'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <Icon name={item.icon} className="w-5 h-5" />
                        <span>{item.label}</span>
                      </div>
                      {item.badge && (
                        <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-800">
                          {item.badge}
                        </span>
                      )}
                    </button>
                  ))}

                        <p className="text-xs text-slate-500">Otomatis memotong 10% omzet kotor tenant mitra</p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        <button
                          onClick={exportCSV}
                          className="px-3 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold flex items-center gap-1.5"
                        >
                          <Icon name="download" className="w-3.5 h-3.5" />
                          Export CSV/Excel
                        </button>
                        <button
                          onClick={exportJSON}
                          className="px-3 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold"
                        >
                          Backup JSON
                        </button>
                        <button
                          onClick={() => fileInputRef.current?.click()}
                          className="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold"
                        >
                          Restore
                        </button>
                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".json"
                          className="hidden"
                          onChange={(e) => {
                            const f = e.target.files?.[0];
                            if (!f) return;
                            const r = new FileReader();
                            r.onload = (ev) => {
                              try {
                                const parsed = JSON.parse(ev.target.result);
                                if (Array.isArray(parsed)) setOrders(parsed);
                              } catch {}
                            };
                            r.readAsText(f);
                          }}
                        />
                      </div>
                    </div>

                    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/50 text-slate-500">
                            <th className="p-3 font-bold">Tenant</th>
                            <th className="p-3 font-bold text-right">Item</th>
                            <th className="p-3 font-bold text-right">Omzet Kotor</th>
                            <th className="p-3 font-bold text-right">Potongan 10%</th>
                            <th className="p-3 font-bold text-right">Hak Bersih</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {summaryByTenant.map((row) => (
                            <tr key={row.id}>
                              <td className="p-3 font-bold">{row.name}</td>
                              <td className="p-3 text-right">{row.totalQty}</td>
                              <td className="p-3 text-right">{formatRp(row.grossSales)}</td>
                              <td className="p-3 text-right font-bold text-amber-600">{formatRp(row.commissionCut)}</td>
                              <td className="p-3 text-right font-extrabold text-emerald-600">{formatRp(row.netPayout)}</td>
                            </tr>
                          ))}
                        </tbody>
                        <tfoot>
                          <tr className="border-t-2 border-slate-200 dark:border-slate-700 font-extrabold bg-slate-50 dark:bg-slate-950/50">
                            <td className="p-3">TOTAL</td>
                            <td className="p-3 text-right">{shiftTotals.qty}</td>
                            <td className="p-3 text-right">{formatRp(shiftTotals.gross)}</td>
                            <td className="p-3 text-right text-amber-600">{formatRp(shiftTotals.commission)}</td>
                            <td className="p-3 text-right text-emerald-600">{formatRp(shiftTotals.net)}</td>
                          </tr>
                        </tfoot>
                      </table>
                    </div>

                    <div className="p-4 rounded-2xl border border-rose-200 dark:border-rose-900/60 bg-rose-50/40 dark:bg-rose-950/20 flex flex-wrap items-center justify-between gap-2">
                      <p className="text-xs text-rose-700 dark:text-rose-300 font-semibold">
                        Tutup shift hari ini? Pastikan laporan sudah di-export terlebih dahulu.
                      </p>
                      <button
                        onClick={() => {
                          if (window.confirm('Reset seluruh transaksi untuk shift baru?')) setOrders([]);
                        }}
                        className="px-3 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold"
                      >
                        Reset Shift
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'menu-admin' && role === 'Admin' && (
                  <div className="flex-1 p-4 lg:p-6 overflow-y-auto space-y-5">
                    <div className="flex items-center justify-between">
                      <h2 className="text-lg font-bold">Kelola Menu & Harga</h2>
                      <button
                        onClick={() => {
                          if (window.confirm('Reset ke daftar menu awal?')) setMenuItems(INITIAL_MENU_ITEMS);
                        }}
                        className="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold"
                      >
                        Reset Menu Awal
                      </button>
                    </div>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        if (!newMenuName.trim() || !newMenuPrice) return;
                        setMenuItems((prev) => [
                          {
                            id: 'item-' + Date.now(),
                            name: newMenuName.trim(),
                            price: Number(newMenuPrice),
                            tenantId: newMenuTenant,
                            category: newMenuCat,
                            available: true,
                            desc: '',
                          },
                          ...prev,
                        ]);
                        setNewMenuName('');
                        setNewMenuPrice('');
                      }}
                      className="p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5"
                    >
                      <input
                        type="text"
                        value={newMenuName}
                        onChange={(e) => setNewMenuName(e.target.value)}
                        placeholder="Nama menu baru..."
                        className="px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"
                      />
                      <input
                        type="number"
                        value={newMenuPrice}
                        onChange={(e) => setNewMenuPrice(e.target.value)}
                        placeholder="Harga (misal 25000)"
                        className="px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"
                      />
                      <select
                        value={newMenuTenant}
                        onChange={(e) => setNewMenuTenant(e.target.value)}
                        className="px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"
                      >
                        {TENANTS.map((t) => (
                          <option key={t.id} value={t.id}>
                            {t.name}
                          </option>
                        ))}
                      </select>
                      <input
                        type="text"
                        value={newMenuCat}
                        onChange={(e) => setNewMenuCat(e.target.value)}
                        placeholder="Kategori..."
                        className="px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"
                      />
                      <button type="submit" className="py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">
                        + Tambah Menu
                      </button>
                    </form>

                    <div className="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/50 text-slate-500">
                            <th className="p-3 font-bold">Menu</th>
                            <th className="p-3 font-bold">Tenant</th>
                            <th className="p-3 font-bold">Harga</th>
                            <th className="p-3 font-bold">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {menuItems
                            .filter((i) => !searchQuery.trim() || i.name.toLowerCase().includes(searchQuery.toLowerCase()))
                            .map((item) => (
                              <tr key={item.id}>
                                <td className="p-3 font-bold">{item.name}</td>
                                <td className="p-3 text-slate-500">{getTenantName(item.tenantId)}</td>
                                <td className="p-3">
                                  <input
                                    type="number"
                                    value={item.price}
                                    onChange={(e) =>
                                      setMenuItems((prev) =>
                                        prev.map((m) => (m.id === item.id ? { ...m, price: Number(e.target.value) } : m))
                                      )
                                    }
                                    className="w-24 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-semibold"
                                  />
                                </td>
                                <td className="p-3">
                                  <button
                                    onClick={() =>
                                      setMenuItems((prev) =>
                                        prev.map((m) => (m.id === item.id ? { ...m, available: !m.available } : m))
                                      )
                                    }
                                    className={`px-2.5 py-1 rounded-full font-bold text-[11px] ${
                                      item.available
                                        ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300'
                                        : 'bg-rose-100 text-rose-800 dark:bg-rose-900/50 dark:text-rose-300'
                                    }`}
                                  >
                                    {item.available ? 'Tersedia' : 'Habis'}
                                  </button>
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* Thermal Receipt Modal */}
            {receiptOrder && (
              <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-sm w-full p-5 shadow-xl border border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2 text-emerald-600 font-bold text-sm">
                      <Icon name="check" className="w-5 h-5" />
                      <span>Struk Transaksi</span>
                    </div>
                    <button onClick={() => setReceiptOrder(null)} className="p-1 text-slate-400">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div
                    id="thermal-receipt-area"
                    className="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-dashed border-slate-300 dark:border-slate-700 font-mono text-xs space-y-2"
                  >
                    <div className="text-center border-b border-dashed border-slate-300 pb-2">
                      <p className="font-bold text-sm">KOPITIAM KOPI & KAYA</p>
                      <p className="text-[11px]">Pekanbaru, Riau</p>
                      <p className="text-[11px] mt-1">
                        {receiptOrder.id} |{' '}
                        {new Date(receiptOrder.createdAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                      </p>
                      <p className="text-[11px]">
                        {receiptOrder.tableName} • {receiptOrder.customerName}
                      </p>
                    </div>

                    <div className="space-y-1 border-b border-dashed border-slate-300 pb-2">
                      {receiptOrder.items.map((item) => (
                        <div key={item.id} className="flex justify-between">
                          <span>
                            {item.qty}x {item.name}
                          </span>
                          <span>{formatRp(item.price * item.qty)}</span>
                        </div>
                      ))}
                    </div>

                    <div className="space-y-1">
                      <div className="flex justify-between font-bold text-sm">
                        <span>TOTAL</span>
                        <span>{formatRp(receiptOrder.total)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>{receiptOrder.paymentMethod}</span>
                        <span>{formatRp(receiptOrder.cashReceived)}</span>
                      </div>
                      {receiptOrder.paymentMethod === 'Tunai' && (
                        <div className="flex justify-between">
                          <span>Kembalian</span>
                          <span>{formatRp(receiptOrder.changeAmount)}</span>
                        </div>
                      )}
                    </div>

                    {receiptOrder.orderNote && (
                      <p className="text-[11px] pt-1 border-t border-dashed border-slate-300">
                        Catatan: {receiptOrder.orderNote}
                      </p>
                    )}

                    <p className="text-center text-[10px] pt-2">Terima kasih telah berkunjung!</p>
                  </div>

                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button
                      onClick={() => window.print()}
                      className="py-2.5 rounded-xl bg-teal-600 text-white text-xs font-bold flex items-center justify-center gap-1.5"
                    >
                      <Icon name="printer" className="w-4 h-4" />
                      <span>Cetak Struk</span>
                    </button>
                    <button
                      onClick={() => setReceiptOrder(null)}
                      className="py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold"
                    >
                      Selesai
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
