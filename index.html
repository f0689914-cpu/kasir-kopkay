          setCart((prev) => {
            const found = prev.find((c) => c.id === item.id);
            if (found) return prev.map((c) => (c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
            return [...prev, { id: item.id, name: item.name, price: item.price, tenantId: item.tenantId, category: item.category, qty: 1 }];
          });
        };

        const updateQty = (id, delta) => {
          setCart((prev) => prev.map((c) => (c.id === id ? { ...c, qty: c.qty + delta } : c)).filter((c) => c.qty > 0));
        };

        const handleCheckout = () => {
          setErrorMsg('');
          if (cart.length === 0) {
            setErrorMsg('Keranjang pesanan masih kosong.');
            return;
          }
          const numericCash = paymentMethod === 'Tunai' ? Number(cashReceived) || subtotal : subtotal;
          if (paymentMethod === 'Tunai' && numericCash < subtotal) {
            setErrorMsg('Uang tunai yang diterima kurang dari total tagihan.');
            return;
          }

          const tenantBreakdown = tenants
            .map((tenant) => {
              const tItems = cart.filter((i) => i.tenantId === tenant.id);
              const grossSales = tItems.reduce((sum, i) => sum + i.price * i.qty, 0);
              const commissionCut = Math.round(grossSales * tenant.commissionRate);
              return {
                tenantId: tenant.id,
                tenantName: tenant.name,
                ownerType: tenant.ownerType,
                commissionRate: tenant.commissionRate,
                grossSales,
                commissionCut,
                netTenantPayout: grossSales - commissionCut,
              };
            })
            .filter((t) => t.grossSales > 0);

          const newOrder = {
            id: 'ORD-' + String(Date.now()).slice(-6),
            shiftId: shiftState?.shiftId || 'default',
            createdAt: new Date().toISOString(),
            orderType,
            tableName: orderType === 'Dine-in' ? tableName : 'Takeaway',
            customerName: customerName.trim() || 'Pelanggan Umum',
            orderNote: orderNote.trim(),
            items: [...cart],
            total: subtotal,
            paymentMethod,
            cashReceived: numericCash,
            changeAmount: paymentMethod === 'Tunai' ? numericCash - subtotal : 0,
            tenantBreakdown,
          };

          setOrders((prev) => [newOrder, ...prev]);

          if (orderType === 'Dine-in') {
            setTables((prev) =>
              prev.map((t) => (t.name === tableName ? { ...t, status: 'available', guestName: '' } : t))
            );
          }

          setCart([]);
          setCustomerName('');
          setOrderNote('');
          setCashReceived('');
          if (activeBillId) {
            setOpenBills((prev) => prev.filter((b) => b.id !== activeBillId));
            setActiveBillId(null);
          }
          setMobileCartOpen(false);
          setReceiptOrder(newOrder);
        };

        const handleSaveOpenBill = () => {
          setErrorMsg('');
          if (cart.length === 0) {
            setErrorMsg('Keranjang masih kosong, pilih menu dulu sebelum menyimpan bill.');
            return;
          }
          const resolvedLabel =
            orderType === 'Dine-in'
              ? `${tableName}${customerName.trim() ? ' - ' + customerName.trim() : ''}`

            setOpenBills((prev) =>

                      ...b,
                      updatedAt: new Date().toISOString(),

                      tableName: orderType === 'Dine-in' ? tableName : 'Takeaway',
                      customerName: customerName.trim(),
                      label: resolvedLabel,
                      orderNote: orderNote.trim(),
                      items: [...cart],
                      total: subtotal,

              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),

              tableName: orderType === 'Dine-in' ? tableName : 'Takeaway',

        const getLocalDateKey = (isoOrDate) => {
          const d = new Date(isoOrDate);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${y}-${m}-${day}`;
        };

        const filteredReportOrders = useMemo(() => {
          if (reportPeriod === 'all') return orders;
          const nowDate = new Date();
          const todayKey = getLocalDateKey(nowDate);
          const yesterdayDate = new Date(nowDate);
          yesterdayDate.setDate(nowDate.getDate() - 1);
          const yesterdayKey = getLocalDateKey(yesterdayDate);

          if (reportPeriod === 'today') {
            return orders.filter((o) => getLocalDateKey(o.createdAt) === todayKey);
          }
          if (reportPeriod === 'yesterday') {
            return orders.filter((o) => getLocalDateKey(o.createdAt) === yesterdayKey);
          }
          const days = reportPeriod === '7d' ? 7 : 30;
          const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
          return orders.filter((o) => new Date(o.createdAt).getTime() >= cutoff);
        }, [orders, reportPeriod]);

        const productSalesByTenant = useMemo(() => {
          const map = new Map();
          filteredReportOrders.forEach((order) => {
            order.items.forEach((item) => {
              const key = `${item.tenantId}__${item.id}__${item.name}`;
              const existing = map.get(key);
              const lineGross = item.price * item.qty;
              if (existing) {
                existing.qty += item.qty;
                existing.grossSales += lineGross;
              } else {
                const tInfo = tenants.find((t) => t.id === item.tenantId);
                map.set(key, {
                  key,
                  productId: item.id,
                  name: item.name,
                  category: item.category || '-',
                  tenantId: item.tenantId,
                  tenantName: tInfo?.name || item.tenantId,
                  commissionRate: tInfo?.commissionRate || 0,
                  unitPrice: item.price,
                  qty: item.qty,
                  grossSales: lineGross,
                });
              }
            });
          });

          return Array.from(map.values())
            .map((row) => {
              const commissionCut = Math.round(row.grossSales * row.commissionRate);
              return {
                ...row,
                commissionCut,
                netPayout: row.grossSales - commissionCut,
              };
            })
            .filter((row) => {
              const matchTenant = reportTenantFilter === 'all' || row.tenantId === reportTenantFilter;
              const matchQuery =
                !reportProductSearch.trim() ||
                row.name.toLowerCase().includes(reportProductSearch.toLowerCase()) ||
                row.tenantName.toLowerCase().includes(reportProductSearch.toLowerCase());
              return matchTenant && matchQuery;
            })
            .sort((a, b) => b.qty - a.qty || b.grossSales - a.grossSales);
        }, [filteredReportOrders, reportTenantFilter, reportProductSearch]);

        const summaryByTenant = useMemo(() => {
          return tenants.map((tenant) => {
            let grossSales = 0;
            let totalQty = 0;
            filteredReportOrders.forEach((order) => {
              order.items.forEach((item) => {
                if (item.tenantId === tenant.id) {
                  grossSales += item.price * item.qty;
                  totalQty += item.qty;
                }
              });
            });
            const commissionCut = Math.round(grossSales * tenant.commissionRate);
            return {
              ...tenant,
              totalQty,
              grossSales,
              commissionCut,
              netPayout: grossSales - commissionCut,
            };
          });
        }, [filteredReportOrders, tenants]);

        const shiftTotals = summaryByTenant.reduce(

            qty: acc.qty + cur.totalQty,
            gross: acc.gross + cur.grossSales,
            commission: acc.commission + cur.commissionCut,
            net: acc.net + cur.netPayout,
          }),
          { qty: 0, gross: 0, commission: 0, net: 0 }
        );

        const todayOrders = useMemo(() => {
          const todayKey = getLocalDateKey(new Date());
          return orders.filter((o) => getLocalDateKey(o.createdAt) === todayKey);

        const todaySummaryByTenant = useMemo(() => {

            let grossSales = 0;

            todayOrders.forEach((order) => {

                  totalQty += item.qty;
                }
              });

            const commissionCut = Math.round(grossSales * tenant.commissionRate);
            return {
              ...tenant,
              totalQty,
              grossSales,
              commissionCut,
              netPayout: grossSales - commissionCut,

        }, [todayOrders, tenants]);

        const todayShiftTotals = todaySummaryByTenant.reduce(

        const todayExpenseTotal = useMemo(

        const kopkayIncome =
          summaryByTenant

        const allTimeKopkayRevenue = useMemo(() => {
          return orders.reduce((sum, order) => {
            let kopkayPart = 0;
            (order.items || []).forEach((item) => {
              const tInfo = tenants.find((t) => t.id === item.tenantId);
              const lineGross = item.price * item.qty;
              if (item.tenantId === 'kopkay') {
                kopkayPart += lineGross;
              } else if (tInfo && tInfo.commissionRate > 0) {
                kopkayPart += Math.round(lineGross * tInfo.commissionRate);
              }
            });
            return sum + kopkayPart;
          }, 0);
        }, [orders, tenants]);

        const allTimeGrossAllTenants = useMemo(
          () => orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0),
          [orders]
        );

        const pphBaseAmount =
          pphConfig?.basis === 'all_gross' ? allTimeGrossAllTenants : allTimeKopkayRevenue;
        const pphRateDecimal = pphConfig?.enabled ? (Number(pphConfig.rate) || 0) / 100 : 0;
        const totalPphAccrued = Math.round(pphBaseAmount * pphRateDecimal);
        const totalPphPaid = useMemo(
          () => pphPayments.reduce((sum, p) => sum + (Number(p.amount) || 0), 0),
          [pphPayments]
        );
        const remainingPphReserve = Math.max(0, totalPphAccrued - totalPphPaid);

        const monthlyPphBreakdown = useMemo(() => {
          const monthMap = new Map();
          orders.forEach((order) => {
            const d = new Date(order.createdAt);
            const monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            const monthLabel = d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
            let kopkayPart = 0;
            (order.items || []).forEach((item) => {
              const tInfo = tenants.find((t) => t.id === item.tenantId);
              const lineGross = item.price * item.qty;
              if (item.tenantId === 'kopkay') {
                kopkayPart += lineGross;
              } else if (tInfo && tInfo.commissionRate > 0) {
                kopkayPart += Math.round(lineGross * tInfo.commissionRate);
              }
            });
            const basisVal = pphConfig?.basis === 'all_gross' ? Number(order.total) || 0 : kopkayPart;
            const prev = monthMap.get(monthKey) || { monthKey, monthLabel, basisTotal: 0, orderCount: 0 };
            prev.basisTotal += basisVal;
            prev.orderCount += 1;
            monthMap.set(monthKey, prev);
          });
          return Array.from(monthMap.values())
            .sort((a, b) => b.monthKey.localeCompare(a.monthKey))
            .map((m) => ({
              ...m,
              pphEstimated: Math.round(m.basisTotal * pphRateDecimal),
            }));
        }, [orders, tenants, pphConfig?.basis, pphRateDecimal]);

        const handleRecordPphDeposit = (amountToRecord) => {
          const amt = Number(amountToRecord);
          if (!amt || amt <= 0) return;
          const periodText =
            pphConfig.cycle === 'monthly'
              ? 'Bulanan'
              : pphConfig.cycle === 'yearly'
              ? 'Tahunan (12 Bulan)'
              : 'Per 6 Bulan (Semester)';
          const paymentRec = {

            rate: Number(pphConfig.rate) || 0,

        const exportCSV = () => {

                </div>
              </div>
            )}

            {/* Thermal Receipt Modal */}
            {receiptOrder && (

                      <Icon name="check" className="w-5 h-5" />

                    </div>
                    <button onClick={() => setReceiptOrder(null)} className="p-1 text-slate-400">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div
                    id="thermal-receipt-area"
                    className="p-4 rounded-xl bg-slate-50 dark:bg-slate-950 border border-dashed border-slate-300 dark:border-slate-700 font-mono text-xs space-y-2"
                  >
                    <div className="text-center border-b border-dashed border-slate-300 pb-2">
                      <p className="font-bold text-sm">KOPITIAM KOPI & KAYA</p>
                      <p className="text-[11px]">Pekanbaru, Riau</p>
                      <p className="text-[11px] mt-1">
                        {receiptOrder.id} |{' '}
                        {new Date(receiptOrder.createdAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}
                      </p>
                      <p className="text-[11px]">
                        {receiptOrder.tableName} • {receiptOrder.customerName}
                      </p>
                    </div>

                    <div className="space-y-1 border-b border-dashed border-slate-300 pb-2">
                      {receiptOrder.items.map((item) => (
                        <div key={item.id} className="flex justify-between">
                          <span>
                            {item.qty}x {item.name}
                          </span>
                          <span>{formatRp(item.price * item.qty)}</span>
                        </div>
                      ))}
                    </div>

                    <div className="space-y-1">
                      <div className="flex justify-between font-bold text-sm">
                        <span>TOTAL</span>
                        <span>{formatRp(receiptOrder.total)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>{receiptOrder.paymentMethod}</span>
                        <span>{formatRp(receiptOrder.cashReceived)}</span>
                      </div>
                      {receiptOrder.paymentMethod === 'Tunai' && (
                        <div className="flex justify-between">
                          <span>Kembalian</span>
                          <span>{formatRp(receiptOrder.changeAmount)}</span>
                        </div>
                      )}
                    </div>

                    {receiptOrder.orderNote && (
                      <p className="text-[11px] pt-1 border-t border-dashed border-slate-300">
                        Catatan: {receiptOrder.orderNote}
                      </p>
                    )}

                    <p className="text-center text-[10px] pt-2">Terima kasih telah berkunjung!</p>
                  </div>

                  {btStatusMsg && (
                    <p className="mt-2.5 text-[11px] font-semibold text-center text-teal-700 dark:text-teal-300 bg-teal-50 dark:bg-teal-950/40 py-1.5 px-2.5 rounded-xl">
                      {btStatusMsg}

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-4">
                    <button
                      type="button"

                    <button
                      type="button"

                      type="button"
                      onClick={() => {
                        setBtStatusMsg('');
                        setReceiptOrder(null);
                      }}
                      className="py-2.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold"
                    >
                      Selesai
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const encodeEscPosReceipt = (order, getTenantLabel) => {
        const encoder = new TextEncoder();
        const bytes = [];
        const push = (...arr) => bytes.push(...arr);
        const pushText = (str) => push(...encoder.encode(str));

        push(0x1b, 0x40);
        push(0x1b, 0x74, 0x00);

        const padLine = (left, right, width = 32) => {
          const l = String(left || '');
          const r = String(right || '');
          const space = Math.max(1, width - l.length - r.length);
          return l.slice(0, Math.max(0, width - r.length - 1)) + ' '.repeat(space) + r;
        };

        const lineSep = '-'.repeat(32) + '\n';

        push(0x1b, 0x61, 0x01);
        push(0x1b, 0x45, 0x01);
        push(0x1d, 0x21, 0x11);
        pushText('KOPKAY POS\n');
        push(0x1d, 0x21, 0x00);
        pushText('KOPITIAM KOPI & KAYA\n');
        push(0x1b, 0x45, 0x00);
        pushText('Pekanbaru, Riau\n');

        push(0x1b, 0x61, 0x00);
        pushText(lineSep);
        const timeStr = new Date(order.createdAt).toLocaleString('id-ID', {
          day: '2-digit',
          month: '2-digit',
          year: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
        });
        pushText(`No   : ${order.id}\n`);
        pushText(`Waktu: ${timeStr}\n`);
        pushText(`Tipe : ${order.orderType} (${order.tableName})\n`);
        pushText(`Plg  : ${order.customerName}\n`);
        pushText(lineSep);

        (order.items || []).forEach((item) => {
          pushText(`${item.qty}x ${item.name}\n`);
          const subStr = formatRp(item.price * item.qty);
          const unitStr = `  @${formatRp(item.price)}`;
          pushText(padLine(unitStr, subStr) + '\n');
        });

        pushText(lineSep);
        push(0x1b, 0x45, 0x01);
        pushText(padLine('TOTAL', formatRp(order.total)) + '\n');
        push(0x1b, 0x45, 0x00);
        pushText(padLine(order.paymentMethod, formatRp(order.cashReceived)) + '\n');
        if (order.paymentMethod === 'Tunai') {
          pushText(padLine('Kembalian', formatRp(order.changeAmount)) + '\n');
        }

        if (order.orderNote) {
          pushText(lineSep);
          pushText(`Catatan: ${order.orderNote}\n`);
        }

        push(0x1b, 0x61, 0x01);
        pushText('\nTerima kasih telah berkunjung!\n\n\n');

        push(0x1d, 0x56, 0x42, 0x00);
        return new Uint8Array(bytes);
      };

      const sendRawToBluetoothPrinter = async (rawBytes, existingDeviceRef) => {
        if (!navigator.bluetooth) {
          throw new Error('Browser ini belum mendukung Web Bluetooth. Gunakan Chrome/Edge di Android/PC, atau gunakan tombol Cetak Struk biasa.');
        }

        const PRINTER_SERVICES = [
          '000018f0-0000-1000-8000-00805f9b34fb',
          'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
          '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        ];

        let device = existingDeviceRef?.current || null;
        if (!device || !device.gatt) {
          device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: PRINTER_SERVICES,
          });
          if (existingDeviceRef) existingDeviceRef.current = device;
        }

        if (!device.gatt.connected) {
          await device.gatt.connect();
        }

        const server = device.gatt;
        const services = await server.getPrimaryServices();
        let writeChar = null;

        for (const service of services) {
          const chars = await service.getCharacteristics();
          for (const ch of chars) {
            if (ch.properties.writeWithoutResponse || ch.properties.write) {
              writeChar = ch;
              break;
            }
          }
          if (writeChar) break;
        }

        if (!writeChar) {
          throw new Error('Characteristic cetak printer Bluetooth tidak ditemukan.');
        }

        const chunkSize = 100;
        for (let i = 0; i < rawBytes.length; i += chunkSize) {
          const chunk = rawBytes.slice(i, i + chunkSize);
          if (writeChar.properties.writeWithoutResponse) {
            await writeChar.writeValueWithoutResponse(chunk);
          } else {
            await writeChar.writeValue(chunk);
          }
          await new Promise((res) => setTimeout(res, 25));
        }

        return device.name || 'Printer Bluetooth';
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
